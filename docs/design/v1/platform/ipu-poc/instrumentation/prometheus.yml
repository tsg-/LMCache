global:
  scrape_interval: 4s
  evaluation_interval: 15s
  external_labels:
    project: ipu-poc-nvmeof-alt

scrape_configs:
  - job_name: node
    static_configs:
      # These reach loopback-only node_exporter instances through SSH tunnels
      # opened on the monitoring host.
      - targets:
          - host.docker.internal:19106   # mmgt  via ssh -L 19106:127.0.0.1:9100 mmgt
          - host.docker.internal:19107   # mmgi0 via ssh -L 19107:127.0.0.1:9100 mmgi0
          - host.docker.internal:19108   # mmgi1 via ssh -L 19108:127.0.0.1:9100 mmgi1
          - host.docker.internal:19109   # mmgi2 via ssh -L 19109:127.0.0.1:9100 mmgi2
          - host.docker.internal:19100   # mmgi3 via ssh -L 19100:127.0.0.1:9100 mmgi3
        labels:
          fabric: mgmt
    relabel_configs:
      - source_labels: [__address__]
        regex: host\.docker\.internal:19106
        target_label: host
        replacement: mmgt
      # The initiators export ACC core usage and Falcon tele_cli counters from
      # their own MMG-400 (one card each, ACC at 200.0.4.3 / 200.0.3.3) via the
      # acc-stats textfile collector, same as mmgt's two cards.
      - source_labels: [__address__]
        regex: host\.docker\.internal:19107
        target_label: host
        replacement: mmgi0
      - source_labels: [__address__]
        regex: host\.docker\.internal:19108
        target_label: host
        replacement: mmgi1
      - source_labels: [__address__]
        regex: host\.docker\.internal:19109
        target_label: host
        replacement: mmgi2
      - source_labels: [__address__]
        regex: host\.docker\.internal:19100
        target_label: host
        replacement: mmgi3

  # Same `bench l2 --serve-metrics` endpoints on the MMG-400 rig, where the load
  # is driven from four initiator hosts instead of one. A separate job keeps the
  # mkp1 panels from summing mmg series into their aggregate: the mkp dashboard
  # filters on job alone.
  #
  # Local port encodes both host and initiator id: 1911x -> mmgi0, 1912x -> mmgi1,
  # 1913x -> mmgi2, 1914x -> mmgi3; the last digit is the id. Remote side is
  # METRICS_BASE_PORT + id on each host.
  #
  # The host-only geometry coordinator uses id 0 (port 9101) on each host.
  # Ports 9102-9104 remain reserved for an explicit local multi-process run.
  # As with the mkp job, `up == 0` between cells is expected, and rates are
  # valid over `phase="measured"` only.
  #
  # A run is scrapeable only while its --serve-metrics endpoint and this host's
  # matching SSH tunnel are both up.
  - job_name: lmcache_bench_mmg
    static_configs:
      # ssh -N -L 1911{0,1,2,3}:127.0.0.1:910{1,2,3,4} mmgi0
      - targets:
          - host.docker.internal:19110   # initiator 0 -> mmgi0 127.0.0.1:9101
          - host.docker.internal:19111   # initiator 1 -> mmgi0 127.0.0.1:9102
          - host.docker.internal:19112   # initiator 2 -> mmgi0 127.0.0.1:9103
          - host.docker.internal:19113   # initiator 3 -> mmgi0 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mmgi0
      # ssh -N -L 1912{0,1,2,3}:127.0.0.1:910{1,2,3,4} mmgi1
      - targets:
          - host.docker.internal:19120   # initiator 0 -> mmgi1 127.0.0.1:9101
          - host.docker.internal:19121   # initiator 1 -> mmgi1 127.0.0.1:9102
          - host.docker.internal:19122   # initiator 2 -> mmgi1 127.0.0.1:9103
          - host.docker.internal:19123   # initiator 3 -> mmgi1 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mmgi1
      # ssh -N -L 1913{0,1,2,3}:127.0.0.1:910{1,2,3,4} mmgi2
      - targets:
          - host.docker.internal:19130   # initiator 0 -> mmgi2 127.0.0.1:9101
          - host.docker.internal:19131   # initiator 1 -> mmgi2 127.0.0.1:9102
          - host.docker.internal:19132   # initiator 2 -> mmgi2 127.0.0.1:9103
          - host.docker.internal:19133   # initiator 3 -> mmgi2 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mmgi2
      # ssh -N -L 1914{0,1,2,3}:127.0.0.1:910{1,2,3,4} mmgi3
      - targets:
          - host.docker.internal:19140   # initiator 0 -> mmgi3 127.0.0.1:9101
          - host.docker.internal:19141   # initiator 1 -> mmgi3 127.0.0.1:9102
          - host.docker.internal:19142   # initiator 2 -> mmgi3 127.0.0.1:9103
          - host.docker.internal:19143   # initiator 3 -> mmgi3 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mmgi3
    relabel_configs:
      - source_labels: [__address__]
        regex: host\.docker\.internal:1911(\d)
        target_label: initiator
        replacement: "$1"
      - source_labels: [__address__]
        regex: host\.docker\.internal:1912(\d)
        target_label: initiator
        replacement: "$1"
      - source_labels: [__address__]
        regex: host\.docker\.internal:1913(\d)
        target_label: initiator
        replacement: "$1"
      - source_labels: [__address__]
        regex: host\.docker\.internal:1914(\d)
        target_label: initiator
        replacement: "$1"
