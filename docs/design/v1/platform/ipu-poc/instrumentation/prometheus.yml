global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    project: ipu-poc-nvmeof-alt

scrape_configs:
  - job_name: node
    static_configs:
      # host.docker.internal resolves to the macOS host from inside containers.
      # These reach node_exporter via the SSH tunnels opened on the host laptop.
      - targets:
          - host.docker.internal:19100   # mkp1 via ssh -L 19100:127.0.0.1:9100 mkp1
          - host.docker.internal:19101   # mkp2 via ssh -L 19101:127.0.0.1:9100 mkp2
          - host.docker.internal:19106   # mmgt  via ssh -L 19106:127.0.0.1:9100 mmgt
          - host.docker.internal:19107   # mmgi0 via ssh -L 19107:127.0.0.1:9100 mmgi0
          - host.docker.internal:19108   # mmgi1 via ssh -L 19108:127.0.0.1:9100 mmgi1
        labels:
          fabric: mgmt
    relabel_configs:
      - source_labels: [__address__]
        regex: host\.docker\.internal:19100
        target_label: host
        replacement: mkp1
      - source_labels: [__address__]
        regex: host\.docker\.internal:19101
        target_label: host
        replacement: mkp2
      - source_labels: [__address__]
        regex: host\.docker\.internal:19106
        target_label: host
        replacement: mmgt
      # The initiators export ACC core usage and Falcon tele_cli counters from
      # their own MMG-400 (one card each, ACC at 200.0.4.3 / 200.0.3.3) via the
      # acc-stats textfile collector, same as mmgt's two cards.
      - source_labels: [__address__]
        regex: host\.docker\.internal:19107
        target_label: host
        replacement: mmgi0
      - source_labels: [__address__]
        regex: host\.docker\.internal:19108
        target_label: host
        replacement: mmgi1

  # `bench l2 --serve-metrics` publishes live submit/success/bytes counters for
  # the lifetime of one CLI process. Four targets because the multi-initiator
  # drivers assign METRICS_BASE_PORT + id, and a single fixed target would only
  # ever see initiator 0.
  #
  # PLANNED CONFIGURATION, not yet exercisable from this branch:
  #   - `--serve-metrics` lives on feat/bench-l2-sustained-only (0d88de0a).
  #   - run_multi_initiator_{load,mixed}.sh, which assign the per-id ports, are
  #     untracked and absent from that branch too.
  # Until both land, expect all four to stay down. Ports 19104/19105 have never
  # been exercised against a real 4-initiator run.
  #
  # Expect `up == 0` between sweep cells: the endpoint dies with the process.
  # That is not a scrape failure. A 120s cell at the 5s interval yields ~24
  # samples. Rate over the `measured` phase only -- the `phase` label separates
  # it from `warmup`, and including warmup biases the result.
  - job_name: lmcache_bench
    static_configs:
      # ssh -N -L 1910{2,3,4,5}:127.0.0.1:910{1,2,3,4} mkp1
      - targets:
          - host.docker.internal:19102   # initiator 0 -> mkp1 127.0.0.1:9101
          - host.docker.internal:19103   # initiator 1 -> mkp1 127.0.0.1:9102
          - host.docker.internal:19104   # initiator 2 -> mkp1 127.0.0.1:9103
          - host.docker.internal:19105   # initiator 3 -> mkp1 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mkp1
          workload: fs_native
    relabel_configs:
      - source_labels: [__address__]
        regex: host\.docker\.internal:19102
        target_label: initiator
        replacement: "0"
      - source_labels: [__address__]
        regex: host\.docker\.internal:19103
        target_label: initiator
        replacement: "1"
      - source_labels: [__address__]
        regex: host\.docker\.internal:19104
        target_label: initiator
        replacement: "2"
      - source_labels: [__address__]
        regex: host\.docker\.internal:19105
        target_label: initiator
        replacement: "3"

  # Same `bench l2 --serve-metrics` endpoints on the MMG-400 rig, where the load
  # is driven from two initiator hosts instead of one. A separate job keeps the
  # mkp1 panels from summing mmg series into their aggregate: the mkp dashboard
  # filters on job alone.
  #
  # Local port encodes both host and initiator id: 1911x -> mmgi0, 1912x -> mmgi1,
  # last digit is the id. Remote side is METRICS_BASE_PORT + id on each host.
  #
  # NOT YET EXERCISED. `bench l2` is not installed on mmgi0/mmgi1 as of
  # 2026-08-27 (the geometry sweep there drives fio), so expect all eight to
  # stay down. Same short-lived-endpoint semantics as the mkp job above: `up ==
  # 0` between cells is expected, and rates are valid over `phase="measured"`
  # only.
  - job_name: lmcache_bench_mmg
    static_configs:
      # ssh -N -L 1911{0,1,2,3}:127.0.0.1:910{1,2,3,4} mmgi0
      - targets:
          - host.docker.internal:19110   # initiator 0 -> mmgi0 127.0.0.1:9101
          - host.docker.internal:19111   # initiator 1 -> mmgi0 127.0.0.1:9102
          - host.docker.internal:19112   # initiator 2 -> mmgi0 127.0.0.1:9103
          - host.docker.internal:19113   # initiator 3 -> mmgi0 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mmgi0
      # ssh -N -L 1912{0,1,2,3}:127.0.0.1:910{1,2,3,4} mmgi1
      - targets:
          - host.docker.internal:19120   # initiator 0 -> mmgi1 127.0.0.1:9101
          - host.docker.internal:19121   # initiator 1 -> mmgi1 127.0.0.1:9102
          - host.docker.internal:19122   # initiator 2 -> mmgi1 127.0.0.1:9103
          - host.docker.internal:19123   # initiator 3 -> mmgi1 127.0.0.1:9104
        labels:
          fabric: mgmt
          host: mmgi1
    relabel_configs:
      - source_labels: [__address__]
        regex: host\.docker\.internal:1911(\d)
        target_label: initiator
        replacement: "$1"
      - source_labels: [__address__]
        regex: host\.docker\.internal:1912(\d)
        target_label: initiator
        replacement: "$1"
