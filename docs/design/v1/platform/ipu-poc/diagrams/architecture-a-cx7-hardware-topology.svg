<svg width="1300" height="600" viewBox="0 0 1300 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="600" fill="#FFFFFF"/>

  <!-- ================= LEFT: Initiator / Compute Server ================= -->
  <rect x="40" y="40" width="520" height="460" rx="16" fill="#FCFCFB" stroke="#000000" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="60" y="63" font-size="15" font-weight="600" fill="#111111">Initiator / Compute Server</text>
  <text x="60" y="81" font-size="12" fill="#555555">CX7 platform: Xeon + CX7</text>

  <!-- GPU/TPU accelerator (media - blue) -->
  <rect x="320" y="90" width="220" height="100" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="430" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">GPU / TPU accelerator</text>
  <text x="430" y="148" text-anchor="middle" font-size="12" fill="#333333">on-package HBM (L0)</text>

  <!-- CPU socket (compute - purple) -->
  <rect x="320" y="230" width="220" height="100" rx="8" fill="#F1EEFB" stroke="#000000" stroke-width="1"/>
  <text x="430" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Xeon CPU socket</text>
  <text x="430" y="292" text-anchor="middle" font-size="12" fill="#333333">PCIe root complex</text>

  <!-- DRAM DIMMs (memory - green) -->
  <rect x="60" y="230" width="200" height="100" rx="8" fill="#EAF6E4" stroke="#000000" stroke-width="1"/>
  <text x="160" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">DRAM DIMMs</text>
  <text x="160" y="292" text-anchor="middle" font-size="12" fill="#333333">pinned MR buffers (L1)</text>

  <!-- HCA card (transport - amber) -->
  <rect x="320" y="370" width="220" height="100" rx="8" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="430" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">CX7 HCA card</text>
  <text x="430" y="432" text-anchor="middle" font-size="12" fill="#333333">port mlx5_1</text>

  <!-- Left internal buses -->
  <line x1="430" y1="190" x2="430" y2="230" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="450" y="215" font-size="11" fill="#555555">PCIe Gen5 x16</text>

  <line x1="260" y1="280" x2="320" y2="280" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="290" y="264" text-anchor="middle" font-size="11" fill="#555555">DDR5 channel</text>

  <line x1="430" y1="330" x2="430" y2="370" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="450" y="355" font-size="11" fill="#555555">PCIe Gen5 x16</text>

  <!-- ================= RIGHT: Storage / NVMe-oF Target Server ================= -->
  <rect x="740" y="40" width="520" height="460" rx="16" fill="#FCFCFB" stroke="#000000" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="760" y="63" font-size="15" font-weight="600" fill="#111111">Storage / NVMe-oF Target Server</text>
  <text x="760" y="81" font-size="12" fill="#555555">CX7 platform: Xeon + CX7</text>

  <!-- NVMe SSD drive (media - blue) -->
  <rect x="760" y="90" width="220" height="100" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="870" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">NVMe SSD drive</text>
  <text x="870" y="148" text-anchor="middle" font-size="12" fill="#333333">exclusive-writer namespace (L2)</text>

  <!-- CPU socket (compute - purple) -->
  <rect x="760" y="230" width="220" height="100" rx="8" fill="#F1EEFB" stroke="#000000" stroke-width="1"/>
  <text x="870" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Xeon CPU socket</text>
  <text x="870" y="292" text-anchor="middle" font-size="12" fill="#333333">PCIe root complex</text>

  <!-- DRAM DIMMs (memory - green) -->
  <rect x="1040" y="230" width="200" height="100" rx="8" fill="#EAF6E4" stroke="#000000" stroke-width="1"/>
  <text x="1140" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">DRAM DIMMs</text>
  <text x="1140" y="292" text-anchor="middle" font-size="12" fill="#333333">staging buffer</text>

  <!-- HCA card (transport - amber) -->
  <rect x="760" y="370" width="220" height="100" rx="8" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="870" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">CX7 HCA card</text>
  <text x="870" y="432" text-anchor="middle" font-size="12" fill="#333333">port rocep153s0f0</text>

  <!-- Right internal buses -->
  <line x1="870" y1="190" x2="870" y2="230" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="890" y="215" font-size="11" fill="#555555">PCIe / NVMe bus</text>

  <line x1="980" y1="280" x2="1040" y2="280" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="1010" y="264" text-anchor="middle" font-size="11" fill="#555555">DDR5 channel</text>

  <line x1="870" y1="330" x2="870" y2="370" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="890" y="355" font-size="11" fill="#555555">PCIe Gen5 x16</text>

  <!-- ================= MIDDLE: RoCEv2 physical link ================= -->
  <rect x="580" y="370" width="140" height="100" rx="8" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="650" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">RoCEv2 link</text>
  <text x="650" y="424" text-anchor="middle" font-size="12" fill="#333333">192.168.200/24</text>
  <text x="650" y="442" text-anchor="middle" font-size="12" fill="#333333">MTU 4096B</text>

  <line x1="540" y1="420" x2="580" y2="420" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="720" y1="420" x2="760" y2="420" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ================= LEGEND ================= -->
  <rect x="150" y="520" width="16" height="16" rx="3" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="174" y="533" font-size="12" fill="#333333">Storage / accelerator media (GPU HBM, NVMe SSD)</text>

  <rect x="150" y="552" width="16" height="16" rx="3" fill="#F1EEFB" stroke="#000000" stroke-width="1"/>
  <text x="174" y="565" font-size="12" fill="#333333">Compute (CPU socket)</text>

  <rect x="700" y="520" width="16" height="16" rx="3" fill="#EAF6E4" stroke="#000000" stroke-width="1"/>
  <text x="724" y="533" font-size="12" fill="#333333">DRAM DIMMs</text>

  <rect x="700" y="552" width="16" height="16" rx="3" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="724" y="565" font-size="12" fill="#333333">Network hardware (HCA, RoCEv2 link)</text>
</svg>
