<svg width="1400" height="600" viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="600" fill="#FFFFFF"/>

  <!-- ================= LEFT: Initiator / Compute Server ================= -->
  <rect x="40" y="40" width="560" height="460" rx="16" fill="#FCFCFB" stroke="#000000" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="60" y="63" font-size="15" font-weight="600" fill="#111111">Initiator / Compute Server</text>
  <text x="60" y="81" font-size="12" fill="#555555">IPU platform: Xeon + MEV/MMG IPU</text>

  <!-- GPU/TPU accelerator (media - blue) -->
  <rect x="310" y="90" width="260" height="100" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="440" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">GPU / TPU accelerator (L0)</text>
  <text x="440" y="152" text-anchor="middle" font-size="12" fill="#333333">on-package HBM</text>

  <!-- CPU socket (compute - purple) -->
  <rect x="310" y="230" width="260" height="100" rx="8" fill="#F1EEFB" stroke="#000000" stroke-width="1"/>
  <text x="440" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Xeon CPU socket</text>
  <text x="440" y="292" text-anchor="middle" font-size="12" fill="#333333">PCIe root complex</text>

  <!-- DRAM DIMMs (memory - green) -->
  <rect x="70" y="230" width="200" height="100" rx="8" fill="#EAF6E4" stroke="#000000" stroke-width="1"/>
  <text x="170" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">DRAM DIMMs (L1)</text>
  <text x="170" y="292" text-anchor="middle" font-size="12" fill="#333333">pinned MR buffers</text>

  <!-- IPU card (transport - amber) -->
  <rect x="310" y="370" width="260" height="100" rx="8" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="440" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">MEV/MMG IPU</text>
  <text x="440" y="432" text-anchor="middle" font-size="12" fill="#333333">network port</text>

  <!-- Left internal buses -->
  <line x1="440" y1="190" x2="440" y2="230" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="460" y="215" font-size="11" fill="#555555">PCIe x16</text>

  <line x1="270" y1="280" x2="310" y2="280" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="290" y="264" text-anchor="middle" font-size="11" fill="#555555">DDR5 channel</text>

  <line x1="440" y1="330" x2="440" y2="370" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="460" y="355" font-size="11" fill="#555555">PCIe x16</text>

  <!-- ================= RIGHT: Storage / NVMe-oF Target Server ================= -->
  <rect x="800" y="40" width="560" height="460" rx="16" fill="#FCFCFB" stroke="#000000" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="820" y="63" font-size="15" font-weight="600" fill="#111111">Storage / NVMe-oF Target Server</text>
  <text x="820" y="81" font-size="12" fill="#555555">IPU platform: Xeon + MEV/MMG IPU</text>

  <!-- NVMe SSD fanout (media - blue), 4 drives -->
  <rect x="830" y="90" width="100" height="80" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="880" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">SSD (L2)</text>
  <text x="880" y="146" text-anchor="middle" font-size="11" fill="#333333">ns 1</text>

  <rect x="950" y="90" width="100" height="80" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="1000" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">SSD (L2)</text>
  <text x="1000" y="146" text-anchor="middle" font-size="11" fill="#333333">ns 2</text>

  <rect x="1070" y="90" width="100" height="80" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="1120" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">SSD (L2)</text>
  <text x="1120" y="146" text-anchor="middle" font-size="11" fill="#333333">ns 3</text>

  <text x="1200" y="140" text-anchor="middle" font-size="22" font-weight="600" fill="#555555">&#8943;</text>

  <rect x="1230" y="90" width="100" height="80" rx="8" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="1280" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">SSD (L2)</text>
  <text x="1280" y="146" text-anchor="middle" font-size="11" fill="#333333">ns X</text>

  <!-- fanout drops + bus + trunk into CPU (4-12 drives, X = last) -->
  <line x1="880" y1="170" x2="880" y2="200" stroke="#000000" stroke-width="1"/>
  <line x1="1000" y1="170" x2="1000" y2="200" stroke="#000000" stroke-width="1"/>
  <line x1="1120" y1="170" x2="1120" y2="200" stroke="#000000" stroke-width="1"/>
  <line x1="1280" y1="170" x2="1280" y2="200" stroke="#000000" stroke-width="1"/>
  <line x1="880" y1="200" x2="1280" y2="200" stroke="#000000" stroke-width="1"/>
  <line x1="960" y1="200" x2="960" y2="230" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="985" y="215" font-size="11" fill="#555555">PCIe / NVMe bus</text>

  <!-- CPU socket (compute - purple) -->
  <rect x="830" y="230" width="260" height="100" rx="8" fill="#F1EEFB" stroke="#000000" stroke-width="1"/>
  <text x="960" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Xeon CPU socket</text>
  <text x="960" y="292" text-anchor="middle" font-size="12" fill="#333333">PCIe root complex</text>

  <!-- DRAM DIMMs (memory - green) -->
  <rect x="1130" y="230" width="200" height="100" rx="8" fill="#EAF6E4" stroke="#000000" stroke-width="1"/>
  <text x="1230" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">DRAM DIMMs (L1)</text>
  <text x="1230" y="292" text-anchor="middle" font-size="12" fill="#333333">staging buffer</text>

  <!-- IPU card (transport - amber) -->
  <rect x="830" y="370" width="260" height="100" rx="8" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="960" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">MEV/MMG IPU</text>
  <text x="960" y="432" text-anchor="middle" font-size="12" fill="#333333">network port</text>

  <!-- Right internal buses -->
  <line x1="1090" y1="280" x2="1130" y2="280" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="1110" y="264" text-anchor="middle" font-size="11" fill="#555555">DDR5 channel</text>

  <line x1="960" y1="330" x2="960" y2="370" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="980" y="355" font-size="11" fill="#555555">PCIe x16</text>

  <!-- ================= MIDDLE: Falcon RDMA physical link ================= -->
  <rect x="625" y="370" width="150" height="100" rx="8" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="700" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">Falcon RDMA</text>
  <text x="700" y="428" text-anchor="middle" font-size="12" fill="#333333">MTU 4096</text>

  <line x1="570" y1="420" x2="625" y2="420" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="775" y1="420" x2="830" y2="420" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ================= LEGEND ================= -->
  <rect x="150" y="520" width="16" height="16" rx="3" fill="#EAF2FB" stroke="#000000" stroke-width="1"/>
  <text x="174" y="533" font-size="12" fill="#333333">Storage / accelerator media (GPU HBM, NVMe SSD)</text>

  <rect x="150" y="552" width="16" height="16" rx="3" fill="#F1EEFB" stroke="#000000" stroke-width="1"/>
  <text x="174" y="565" font-size="12" fill="#333333">Compute (CPU socket)</text>

  <rect x="750" y="520" width="16" height="16" rx="3" fill="#EAF6E4" stroke="#000000" stroke-width="1"/>
  <text x="774" y="533" font-size="12" fill="#333333">DRAM DIMMs</text>

  <rect x="750" y="552" width="16" height="16" rx="3" fill="#FDF1DC" stroke="#000000" stroke-width="1"/>
  <text x="774" y="565" font-size="12" fill="#333333">Network hardware (IPU, Falcon RDMA)</text>
</svg>
