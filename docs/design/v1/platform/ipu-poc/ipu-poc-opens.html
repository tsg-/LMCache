  --color-bg: #ffffff;
  --color-bg-alt: #f6f8fa;
  --color-border: #d0d7de;
  --color-accent: #0550ae;
  --color-accent2: #1a7f37;
  --color-accent3: #cf222e;
  --color-accent4: #6639ba;
  --color-blue: #0969da;
  --color-text: #1f2328;
  --color-muted: #57606a;
  --color-warn: #9a6700;
}

section {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
  font-size: 19px;
  padding: 36px 48px 88px 48px;
}

/* Title */
section.title {
  background: linear-gradient(150deg, #f0f6ff 0%, #ffffff 55%, #f6f8fa 100%);
  border-top: 6px solid var(--color-blue);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.title h1 {
  font-size: 2.1em;
  font-weight: 800;
  color: var(--color-blue);
  line-height: 1.15;
  margin: 0 0 0.25em 0;
  border: none;
}
section.title h2 {
  font-size: 1.1em;
  font-weight: 400;
  color: var(--color-text);
  margin: 0 0 0.15em 0;
  border: none;
}
section.title .byline {
  color: var(--color-muted);
  font-size: 0.82em;
  margin-top: 1.8em;
  border-top: 1px solid var(--color-border);
  padding-top: 0.9em;
}

/* Small — dense slides (long &lt;pre&gt;, wide tables, deep card grids).
   Scales everything proportionally by dropping the base font size. */
section.small {
  font-size: 15px;
  padding: 28px 40px 76px 40px;
}
section.small pre { font-size: 0.70em; line-height: 1.35; padding: 0.7em 0.9em; }
section.small ul li { margin: 0.18em 0; line-height: 1.30; }
section.small table { font-size: 0.78em; }
section.small .card { font-size: 0.80em; padding: 0.6em 0.85em; }

/* Headings */
h1 {
  font-size: 1.5em;
  font-weight: 700;
  color: var(--color-blue);
  border-bottom: 2px solid var(--color-border);
  padding-bottom: 0.25em;
  margin-bottom: 0.5em;
}
h2 {
  font-size: 1.0em;
  font-weight: 600;
  color: var(--color-accent4);
  margin: 0.5em 0 0.25em 0;
}
h3 {
  font-size: 0.82em;
  font-weight: 700;
  color: var(--color-accent2);
  margin: 0.35em 0 0.15em 0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Code */
code {
  background: #eef2f7;
  color: var(--color-accent);
  border: 1px solid #c8d5e8;
  border-radius: 4px;
  padding: 0.1em 0.4em;
  font-size: 0.82em;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
}
pre {
  background: #f6f8fa;
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-blue);
  border-radius: 6px;
  padding: 0.9em 1.1em;
  font-size: 0.74em;
  line-height: 1.5;
  overflow: hidden;
}
pre code {
  background: transparent;
  border: none;
  padding: 0;
  color: var(--color-accent);
}

/* Blockquote */
blockquote {
  background: #f0f6ff;
  border-left: 4px solid var(--color-blue);
  border-radius: 0 6px 6px 0;
  margin: 0.5em 0;
  padding: 0.55em 1em;
  color: var(--color-text);
  font-size: 0.86em;
}
blockquote p { margin: 0; }
blockquote strong { color: var(--color-blue); }

/* Lists */
ul { padding-left: 1.3em; margin: 0.2em 0; }
ul li { margin: 0.28em 0; line-height: 1.38; }
ul li::marker { color: var(--color-blue); }

/* Tables */
table { font-size: 0.82em; }
th { background: var(--color-bg-alt); }

/* Columns */
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 0.5em;
}
.card {
  background: var(--color-bg-alt);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  padding: 0.75em 1em;
  font-size: 0.86em;
}
.card ul { margin: 0.2em 0; }
.card h2, .card h3 { margin-top: 0; }
.card-green  { border-top: 3px solid var(--color-accent2); }
.card-blue   { border-top: 3px solid var(--color-blue); }
.card-red    { border-top: 3px solid var(--color-accent3); }
.card-purple { border-top: 3px solid var(--color-accent4); }
.card-amber  { border-top: 3px solid var(--color-warn); }

/* Footer / paginate */
section::after {
  color: var(--color-muted);
  font-size: 0.68em;
}
footer {
  color: var(--color-muted);
  font-size: 0.66em;
  border-top: 1px solid var(--color-border);
}

<h1 id="three-namespaces-used-throughout-this-deck">Three Namespaces Used Throughout This Deck</h1>
<p>Everything in the Architecture A section below refers to one of three<br />
independent namespaces. They are not synonyms and they are not<br />
sequential.</p>
<table>
<thead>
<tr>
<th>Namespace</th>
<th>What it names</th>
<th>Values used here</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Architecture A / B</strong></td>
<td>Software ownership model — where cache semantics (hash, admission, allocator, WAL, map) live</td>
<td>A = initiator-owned, B = storage-owned</td>
</tr>
<tr>
<td><strong>Platform</strong></td>
<td>Hardware platforms evaluated under Architecture A</td>
<td>CX7 (Mellanox reference, completed), <strong>MEV (Intel IPU / Falcon — this plan)</strong>, MMG (Intel IPU / MMG-400 / IPT, follow-on ~Aug 2026)</td>
</tr>
<tr>
<td><strong>Stage 0–5</strong></td>
<td>MEV kernel-path delivery milestones</td>
<td>Stage 0 kickoff → Stage 5 workload evidence</td>
</tr>
</tbody>
</table>
<br />
<p><strong>Reading rule:</strong> the plan of record is now the MEV kernel-path<br />
bring-up. CX7 is a completed cross-platform reference (retained for<br />
sanity); the IPU offload phase (D-init / D-tgt / D-both, endpoint TBD)<br />
runs against the MEV T7 kernel-path baseline on the same hosts. MMG is<br />
a follow-on when silicon lands.</p>
<p><strong>On every MMG slide:</strong> endpoint offload is pending D-init / D-tgt /<br />
D-both. <strong>MMG never owns cache semantics</strong> in any option — it is a<br />
transport engine.</p>
<footer>IPU KV Cache PoC</footer>

<h1 id="initiator-owned-cache-semantics-remote-nvme-of-l2">Initiator-Owned Cache Semantics, Remote NVMe-oF L2</h1>
<h2 id="architecture-a-vs-b">Architecture A vs B</h2>
<table>
<thead>
<tr>
<th></th>
<th>A: Initiator-owned + remote NVMe-oF L2</th>
<th>B: Storage-owned RDMA + LMCache server</th>
</tr>
</thead>
<tbody>
<tr>
<td>Storage role</td>
<td>Passive NVMe-oF namespace (<code>nvmet-rdma</code>)</td>
<td>Smart cache (hash, admission, eviction)</td>
</tr>
<tr>
<td>Initiator role</td>
<td>Owns cache metadata, allocator, WAL durability</td>
<td>Thin (expose MR, request by hash)</td>
</tr>
<tr>
<td>Durable commit</td>
<td>WAL: intent → payload+FUA → checksum+FUA → commit+flush → publish → ACK. COW deferred.</td>
<td>BLAKE3-on-commit gated by target admission</td>
</tr>
<tr>
<td>Multi-initiator dedup</td>
<td>Out of scope</td>
<td>Yes (global hash index on server)</td>
</tr>
<tr>
<td>NVMe framing</td>
<td>Yes (<code>nvmet-rdma</code> capsules)</td>
<td>No (raw RDMA verbs)</td>
</tr>
<tr>
<td>Target admission / lease</td>
<td>None; initiator-local BLAKE3 verify only</td>
<td>Present</td>
</tr>
<tr>
<td>IPU offload surface</td>
<td><code>nvme_rdma</code> and/or <code>nvmet-rdma</code> (D-init / D-tgt / D-both)</td>
<td>Target LMCache + admission</td>
</tr>
</tbody>
</table>
<p><strong>Customer-requested lower-risk path.</strong> Measurement objective:<br />
host-CPU-per-GB reduction and MR/QP churn removal on the offloaded<br />
endpoint(s), against the <strong>MEV kernel-path T7 baseline</strong> produced<br />
by this plan (same hardware). CX7 T7 is retained as a cross-platform<br />
reference. B remains the alternative if target admission, dedup, or<br />
multi-initiator semantics prove necessary.</p>
<p><strong>Not &quot;works today.&quot;</strong> The <code>raw_block</code> L2 adapter publishes its<br />
in-memory index right after header+payload writes; durable metadata<br />
is a periodic mirrored checkpoint with no fsync/FLUSH/FUA ordering<br />
against payload. A requires the WAL commit-record + map-publish<br />
machinery before it can claim durable cache correctness on crash.</p>
<footer>IPU KV Cache PoC</footer>

<h1 id="architecture-a--host-vs-ipu-roles-per-node">Architecture A — Host vs IPU Roles (per node)</h1>
<pre>
INITIATOR NODE                              TARGET (NVMe-oF) NODE
──────────────                              ─────────────────────

Initiator Xeon (full cache brain):          Target Xeon (transport + block only):
 • LMCache engine, token hashing              • Linux nvmet + nvmet-rdma, NQN ACL, namespace export
 • Local {key,digest} idempotency             • Linux kernel block layer, SSD driver
 • L1 (initiator DRAM) management + LRU       • No LMCache, no hash table, no admission
 • L2 allocator + key→LBA map                 • No LRU, no cache DRAM tier
 • WAL: intent, checksum, commit, recovery    • SSD is the durable L2 medium
 • Issues NVMe-oF I/O; returns final ACK

Initiator IPU (D-init or D-both, MEV/MMG):  Target IPU (D-tgt or D-both, MEV/MMG):
 • Terminates NVMe-oF initiator path          • Terminates NVMe-oF target path
   (replaces / accelerates nvme_rdma)           (replaces / accelerates nvmet-rdma)
 • MRs registered by LMCache                  • Drives SSD via NVMe-oF passthrough
 • No cache logic, no WAL, no map             • No cache logic, no WAL, no map
</pre>
<br />
<p><strong>Endpoint offload is pending D-init / D-tgt / D-both.</strong> MMG never<br />
owns cache semantics in any option — it is a transport engine.</p>
<footer>IPU KV Cache PoC</footer>

<h1 id="architecture-a--store-initiator-owned-durable-commit">Architecture A — STORE (Initiator-Owned Durable Commit)</h1>
<pre>
LMCache (Init Xeon)         Init nvme_rdma      NVMe-oF/RDMA      Target nvmet-rdma        SSD (L2)
───────────────────         ──────────────      ────────────      ─────────────────        ────────
1. store(tokens, kv)
2. GPU HBM → init DRAM
3. Hash → BLAKE3 D;
   {key,D} idempotency
4. L1 put(key, PENDING)     (not lookup-visible)
5. WAL intent + FLUSH  ──► NVMe WRITE+FLUSH ──►                ──► write+flush ──►         intent durable
6. Payload (FUA, 256K) ──► NVMe WRITE ────────►
                           ◄── RDMA READ ─────                 (target pulls init MR)
                           ──── 256K payload ─►                ──► block write+FUA ─►      payload durable
7. Checksum (FUA)     ───► NVMe WRITE (FUA) ──►                ──► write+FUA ─────►       cksum durable
8. WAL COMMIT + FLUSH ───► NVMe WRITE+FLUSH ──►                ──► write+flush ──►         commit durable
                           ◄── flush cqe ─────                                              c5 BEGINS
9. Publish key→LBA + L1 PENDING→VISIBLE (atomic)                                            c5 ENDS
10. Terminal ACK
</pre>
<div class="cols">
<div class="card card-blue">
<h3 id="c5-window-step-8-cqe-%E2%86%92-step-9">c5 window (step 8 cqe → step 9)</h3>
<p>COMMITTED record durable on media, map/L1 not yet flipped. Recovery<br />
reconstructs the new value from the WAL exactly once. Fault-matrix<br />
test T4 exercises this boundary.</p>
</div>
<div class="card card-purple">
<h3 id="ack-loss-retry">ACK-loss retry</h3>
<p>Keyed on <code>{key, digest}</code>: absent → start; PENDING → join / retry;<br />
VISIBLE → no-op success; different digest for same key → reject.<br />
Never allocate or WAL-write twice.</p>
</div>
</div>
<p><strong>Wire direction ≠ pull semantics.</strong> <code>nvmet-rdma</code> issues the RDMA<br />
Read at step 6 as its normal transport implementation of the NVMe<br />
Write. No target-side cache decision precedes it. Architecture B is<br />
the pull-with-admission model.</p>
<footer>IPU KV Cache PoC</footer>

<h1 id="architecture-a--retrieve-initiator-owned-lookup">Architecture A — RETRIEVE (Initiator-Owned Lookup)</h1>
<pre>
LMCache (Init Xeon)         Init nvme_rdma      NVMe-oF/RDMA      Target nvmet-rdma        SSD (L2)
───────────────────         ──────────────      ────────────      ─────────────────        ────────
1. retrieve(tokens)
2. Hash tokens → BLAKE3 keys
3. L1 lookup (exclude PENDING)

L1 HIT:  get from L1 → DMA to GPU HBM → resume    (no fabric traffic)

L1 MISS → key→LBA map lookup:
  L2 HIT:  4. io_uring NVMe read (O_DIRECT, 256K)
                          ─── NVMe READ ────►                    ── read ──►                return block
                          ◄── 256K RDMA WRITE ──                 (target → init MR)
           5. Recompute BLAKE3; compare to committed digest
              OK:   optional promote to L1, DMA to GPU HBM
              FAIL: mark stale, discard map entry, return miss
  L2 MISS: return miss → caller recomputes KV
</pre>
<br />
<p><strong>No target-side lookup, hash table, admission, or L1 branch.</strong><br />
The target only serves NVMe-oF commands and moves blocks to/from<br />
the SSD.</p>
<footer>IPU KV Cache PoC</footer>

<h1 id="architecture-a--mev-kernel-path-delivery-stages-2026-07-23">Architecture A — MEV Kernel-Path Delivery Stages (2026-07-23)</h1>
<p>Stages 0–5 land on the MEV lab (Intel IPU, PCIe Gen4, 1x 100 GbE<br />
Falcon; 2x Samsung PM9A3 Gen4 SSDs on the target — sized to saturate<br />
100 GbE on the read path). CX7 is a completed reference baseline; the<br />
IPU offload phase and MMG are separate follow-on plans.</p>
<ul>
<li><strong>Stage 0</strong> — Freeze contract (namespaces, NQNs, ownership); pass all<br />
§5.2 gates including Falcon/perftest sanity and fabric fault-injection<br />
capability</li>
<li><strong>Stage 1</strong> — Prove safe NVMe-oF lifecycle over <code>irdma</code>/Falcon (T1).<br />
<strong>Two-week abort rule:</strong> if <code>nvme_rdma</code>/<code>nvmet_rdma</code> over <code>irdma</code><br />
doesn't work in that window, D2-kernel-path aborts and the plan<br />
pivots to a userspace-target/initiator revision</li>
<li><strong>Stage 2</strong> — Remote-L2 I/O baseline (block-I/O sweep, SHA-256 verify)</li>
<li><strong>Stage 3</strong> — WAL-based durable publication (intent → payload+FUA →<br />
checksum+FUA → commit+flush → publish → ACK)</li>
<li><strong>Stage 4</strong> — Two tracks: T4 crash matrix at all 6 A.3 cutpoints<br />
(incl. c5 committed-but-not-visible) + T5 fabric-fault matrix on<br />
named in-flight NVMe operations</li>
<li><strong>Stage 5</strong> — LMCache integration + workload evidence; <strong>T7 MEV<br />
kernel-path baseline</strong> for the follow-on offload phase (same<br />
hardware) and MMG (cross-platform reference)</li>
</ul>
<br />
<p>Architecture B (storage-owned pull) proceeds on its own track with M1<br />
raw-verbs baselines done and M2 admission gating in progress.</p>

<h1 id="open-questions-for-anthropic">Open Questions for Anthropic</h1>
<div class="cols">
<div class="card card-blue">
<h3 id="architecture-choice">Architecture choice</h3>
<p>Does the target need cache-level decisions (dedup, admission, LRU)<br />
BEFORE serving data, or is a passive NVMe-oF namespace acceptable?</p>
<p>An NVMe-oF target's RDMA Read to fetch a Write payload is standard<br />
transport behavior, not cache-semantic pull.</p>
<p>→ Cache-level admission required: prioritize B.<br />
→ Otherwise: A stays eligible.</p>
</div>

<h3 id="software-stack-for-a">Software stack for A</h3>
<p>Linux kernel <code>nvme_rdma</code> / <code>nvmet_rdma</code> (fastest validation), or<br />
SPDK userspace (max control over polling, queueing, CPU)?</p>
<p>Preference may differ per endpoint (initiator vs target).</p>
</div>
</div>

<div class="card card-green">

<ul>
<li>Min host-CPU reduction at comparable throughput</li>
<li>Max p99 latency regression for small I/O</li>
<li>Max sustained-throughput regression for large I/O</li>
<li>Reconnect-timeout ceiling; time-to-cache-online after cold restart</li>
</ul>
</div>

<p>Read-heavy retrieval, write-heavy durable store, or a mixed<br />

<h1 id="the-lmcache-storage-backend-benchmark--vs-our-goals">The LMCache storage-backend benchmark — vs. our goals</h1>
<p><strong>Project goal:</strong> validate that D1 (RAID0 remote NVMe-oF, 100 → 400 → 1600 GbE)<br />
sustains vLLM's KV traffic — <strong>store on prefill, retrieve on decode, at<br />
production tail latency</strong>.</p>
<div class="cols">
<div class="card card-green">
<h3 id="what-it-measures">What it measures</h3>
<ul>
<li><strong>On-disk bandwidth ceiling</strong> of the backend read / write implementation</li>
<li><strong>Bytes / op and file layout</strong> — one flat-dir file per KV chunk, real DeepSeek-V3 shape (28 MiB @ 256-token bf16)</li>
<li><strong>Effect of <code>O_DIRECT</code> vs page cache</strong> on the write path</li>
<li><strong>Working set &gt; DRAM</strong> — sized by chunk count, tunable</li>
<li><strong>One concurrency dial</strong> — submission-side (backend I/O pool is a fixed default of 4 workers today, not a CLI knob)</li>
</ul>
</div>
<div class="card card-amber">
<h3 id="still-outside-this-benchmark">Still outside this benchmark</h3>
<ul>
<li><strong>End-to-end retrieve latency to the GPU</strong> — no CPU→GPU staging; H2D PCIe / NVLink cost invisible. That step is where a real serve-loop actually pays.</li>
<li><strong>End-to-end mixed traffic</strong> — an accepted 5:1 <code>fs_native</code> run exists, but it uses one process and existing controllers. It does not cover a serving pipeline or explain why reads fall under write load.</li>
<li><strong>Serving latency (p50 / p95 / p99)</strong> — <code>bench l2</code> now records per-submit p50/p99, but it does not include CPU→GPU staging or a representative serving trace.</li>
<li><strong>Back-pressure / pipeline stalls</strong> — no counter surfaced. Cannot tell where the pipeline stalls at 12 GB/s.</li>
<li><strong>Memory-pressure eviction</strong> — CPU pool defaults skip this path.</li>
<li><strong>Capacity eviction</strong> — can be provoked, but its effect on a serving workload is still unmeasured.</li>
<li><strong>Page-cache behavior without <code>O_DIRECT</code></strong> — not characterized for these runs.</li>
</ul>
</div>
</div>
<div class="cols">
<div class="card card-blue">
<h3 id="how-we-use-it">How we use it</h3>
<ul>
<li>The bench is <strong>necessary but not sufficient for an LMCache / vLLM scaling claim at 400 / 1600 GbE.</strong> It bounds the disk-tier ceiling; it does <strong>not</strong> bound the end-to-end retrieve latency vLLM will see. D1's own remote-NVMe baseline exit is a separate, already-scoped step.</li>
<li>Once the read path is fixed, we get: (a) cold-cache read GB/s at various I/O-pool sizes, (b) put-side bandwidth vs. concurrency.</li>
<li>We still need an <strong>integrated test</strong> to cover CPU → GPU staging, sustained mixed R/W, and tail-latency behavior.</li>
</ul>
</div>
</div>
<footer>IPU KV Cache PoC</footer>

<h1 id="stage-2-bring-up-finding--the-harness-silently-masks-read-failures">Stage 2 bring-up finding — the harness silently masks read failures</h1>
<p><strong>Setup.</strong> mkp1 (initiator) <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> mkp2 (target), 100 GbE Falcon, md0 RAID0</p>
<ul>
<li>XFS on 2× PM9A3, DeepSeek-V3 KV geometry (28 MiB / chunk), <code>O_DIRECT</code>.</li>
</ul>
<div class="cols">
<div class="card card-red">
<h3 id="what-happened">What happened</h3>
<ul>
<li><strong>Bottom line: writes moved data over the wire; reads did not.</strong> We corrected the test before making any performance claim.</li>
<li>Read cell reported <strong>7,746 ops/s at c=1</strong> (≈ 228 GB/s — impossible on 100 GbE)</li>
<li>RDMA verbs counters: <strong>write phase moved 15.03 GB over the wire; read phase moved ZERO</strong></li>
<li>Every &quot;read&quot; was actually an <code>EINVAL</code> on the <code>O_DIRECT</code> <code>readinto</code> syscall</li>
</ul>
<h3 id="root-cause">Root cause</h3>
<ul>
<li>The read destination allocator returns a non-page-aligned CPU tensor</li>
<li>The backend opens the file with <code>O_DIRECT</code>; kernel rejects the unaligned user buffer with <code>EINVAL</code></li>
<li>Exception is caught in the read helper, logged at ERROR, slot returns <code>None</code></li>
<li>Harness times elapsed regardless of success / failure → ops/s looks great</li>
</ul>
</div>
<div class="card card-purple">
<h3 id="what-we-can-still-trust">What we can still trust</h3>
<ul>
<li><strong>Write path</strong> — harness aligns its write buffers manually; the backend put path is exercised</li>
<li><strong>Single-drive O_DIRECT write</strong> = 2.66 GB/s — an observation, not a bottleneck claim (needs a matched <strong>single-drive</strong> direct-write fio control before it can be compared)</li>
</ul>
<h3 id="what-that-smoke-run-did-not-prove">What that smoke run did not prove</h3>
<ul>
<li>Cold-cache read bandwidth end-to-end</li>
<li>CPU → GPU staging (never invoked)</li>
<li>Per-submit tail latency, sustained mixed R/W, memory-pressure eviction</li>
<li>Last night's smoke doc's <strong>6.21 GB/s single-drive O_DIRECT read = 89 % of fio</strong> is invalid and needs retraction</li>
</ul>
</div>
</div>
<div class="cols">
<div class="card card-green">
<h3 id="before-we-trust-stage-2-reads">Before we trust Stage 2 reads</h3>
<ol>
<li><strong>Page-align the read buffer.</strong> <code>O_DIRECT</code> requires page alignment; pinning alone is not sufficient.</li>
<li><strong>Invalidate cache between phases</strong> — page-drop each written path before the read phase begins.</li>
<li><strong>Add success / failure accounting</strong> — count <code>None</code> returns; fail the run on any failed read so this defect cannot recur unnoticed.</li>
<li><strong>Upstream correctness bug</strong> — the read helper swallows <code>OSError</code> and returns <code>None</code>. File upstream regardless of the benchmark.</li>
</ol>
</div>
<div class="card card-blue">
<h3 id="corrections-to-last-nights-smoke-doc">Corrections to last night's smoke doc</h3>
<ul>
<li><strong>Retracted:</strong> &quot;6.21 GB/s single-drive O_DIRECT read = 89% of fio ceiling&quot;<br />
was 512 immediate <code>EINVAL</code>s.</li>
<li><strong>Retracted:</strong> &quot;The backend does NOT collapse at chunk size&quot; was not proven;<br />
the read path was never measured.</li>
<li><strong>Retained:</strong> 2.66 GB/s O_DIRECT single-drive write is a real observation<br />
(RDMA counters agree), but has no matched fio comparison yet.</li>
<li>Add an addendum to the smoke document.</li>
</ul>
</div>
</div>
<footer>IPU KV Cache PoC</footer>
</section>

<h1 id="single-process-functional-test-topology--100-gbe-falcon-backed-nvme-of">Single-Process Functional-Test Topology — 100 GbE Falcon-Backed NVMe-oF</h1>
<pre><code>mkp1 (initiator)
  LMCache bench l2, one fs_native process, O_DIRECT
       ↓
  XFS on md0 RAID0 (256 KiB chunk)
       ↓
  kernel nvme_rdma: 2 existing controllers, 16 I/O queues each
       ↓  100 GbE direct IPU ↔ IPU, active_mtu=4096
  Falcon-backed link: idpf + irdma / rocep69s0f0
       ↓
mkp2 (target)
  kernel nvmet_rdma
       ↓
  PM9A3 nvme1n1 (NQN 1) + PM9A3 nvme2n1 (NQN 2)</code></pre>
<div class="cols">
<div class="card card-blue">
<h3 id="what-is-exercised">What is exercised</h3>
<ul>
<li>Full kernel storage path: <code>fs_native</code> → XFS → md0 → NVMe-oF →<br />
<code>nvmet-rdma</code> → two SSDs</li>
<li>34 established RC QPs are live: 2 controllers × (16 I/O + 1 admin)</li>
<li>303–400 GiB working sets exceed mkp1's 251 GiB DRAM; reads use <code>O_DIRECT</code></li>
</ul>
</div>
<div class="card card-amber">
<h3 id="scope-of-this-test">Scope of this test</h3>
<ul>
<li>Falcon-backed transport, <strong>not Falcon endpoint offload</strong></li>
<li>Existing controllers and one process only; <code>--in-flight</code> is not QP count</li>
<li>Not a 64-QP/R2, physical multi-initiator, 400 GbE, or 4×400 GbE result</li>
</ul>
</div>
</div>
<footer>IPU KV Cache PoC</footer>

<h1 id="bench-l2-performance-dials--28-mib-sustained-read"><code>bench l2</code> Performance Dials — 28 MiB Sustained Read</h1>
<table>
<thead>
<tr>
<th>Dial</th>
<th>Value in the accepted sweep</th>
<th>What it controls</th>
<th>Why this value</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>--only load</code></td>
<td>load only</td>
<td>Direction of generated I/O</td>
<td>Measures the Falcon/NVMe-oF read path; the separately prepopulated corpus makes the measured cells read-only</td>
</tr>
<tr>
<td><code>--data-size-kb</code></td>
<td><code>28672</code></td>
<td>Payload per LMCache key</td>
<td>28 MiB is the DeepSeek-V3 256-token KV-chunk proxy</td>
</tr>
<tr>
<td><code>--num-keys</code></td>
<td><code>1</code></td>
<td>KV chunks per adapter submit</td>
<td>Keeps one submit equal to one proxy chunk, so <code>--in-flight</code> is the only submission-width sweep axis</td>
</tr>
<tr>
<td><code>--in-flight</code></td>
<td><code>4</code>, <code>16</code>, <code>64</code></td>
<td>Outstanding user-space submits</td>
<td>Tests how much request concurrency is needed to fill the link; it does <strong>not</strong> create NVMe/RDMA QPs</td>
</tr>
<tr>
<td><code>num_workers</code></td>
<td><code>16</code></td>
<td><code>fs_native</code> adapter worker pool</td>
<td>Held fixed so the sweep isolates submission concurrency; not claimed as a globally optimal worker count</td>
</tr>
<tr>
<td><code>use_odirect</code></td>
<td><code>true</code></td>
<td>Filesystem cache bypass</td>
<td>Ensures the measured reads reach the NVMe-oF path rather than succeeding from host page cache</td>
</tr>
<tr>
<td><code>--rounds</code></td>
<td><code>11072 / in-flight</code></td>
<td>Prepopulated load-wrap space</td>
<td>Holds the corpus at 303 GiB, above initiator DRAM, so repeated reads do not fit in memory</td>
</tr>
</tbody>
</table>
<div class="cols">
<div class="card card-green">
<h3 id="results">Results</h3>
<ul>
<li>At 28 MiB/key, even four outstanding chunks carry 112 MiB of payload</li>
<li>4 / 16 / 64 in-flight reached 95.63 / 95.94 / 95.94 Gbps</li>
<li>The saturation knee is at or below 4; it was <strong>not</strong> located because 1 and 2 were not run</li>
</ul>
</div>
<div class="card card-amber">
<h3 id="still-outside-this-read-sweep">Still outside this read sweep</h3>
<ul>
<li>One accepted 5:1 run reached <strong>63.89 Gbps read + 12.78 Gbps write</strong><br />
(<strong>76.67 Gbps aggregate</strong>). It uses the same controllers and a single<br />
global <code>--in-flight 16</code> window; it does not isolate the cause of its lower<br />
read goodput.</li>
<li>No new controllers or QPs: the test uses the two established controllers with 16 I/O queues each</li>
<li>This single-process sweep did not exercise local multi-process or physical<br />
multi-initiator traffic</li>
</ul>
</div>
</div>
<footer>IPU KV Cache PoC</footer>
</section>

<h1 id="multi-instance-context--shared-readers-now-shared-writers-later">Multi-Instance Context — Shared Readers Now, Shared Writers Later</h1>
<table>
<thead>
<tr>
<th>Current local test</th>
<th>2/4 <code>bench l2</code> processes on mkp1, same immutable <code>ds28m</code> corpus</th>
</tr>
</thead>
<tbody>
<tr>
<td>4-process result</td>
<td><strong>95.9436 Gbps</strong>, 1 ms measured-start skew, all keys succeeded</td>
</tr>
<tr>
<td>Why aggregate throughput is flat</td>
<td>A single process already fills the one 100 GbE path</td>
</tr>
</tbody>
</table>
<p>The local driver, report, and result document are not committed yet. Treat this<br />
as experimental evidence, not a reproducible released result.</p>
<div class="cols">
<div class="card card-green">
<h3 id="what-the-local-reader-test-shows">What the local reader test shows</h3>
<ul>
<li>Independent LMCache adapter instances concurrently load the same 303 GiB<br />
<code>fs_native</code> corpus through existing NVMe-oF controllers</li>
<li>No misses, corpus mutation, or RDMA error-counter deltas in the accepted runs</li>
<li>This establishes local process fan-in and shared immutable-L2 reads</li>
</ul>
</div>
<div class="card card-amber">
<h3 id="what-shared-writers-would-need">What shared writers would need</h3>
<ul>
<li>No MP server, coordinator, P2P directory, physical second initiator, or<br />
shared writer was exercised</li>
<li>Current <code>raw_block</code> metadata is process-local; concurrent writers need a<br />
target-side authority for conditional create, allocation, WAL/replay,<br />
checksum validation, and GC</li>
<li>The 4x400 baseline keeps L2 pools exclusive per initiator before considering<br />
a shared writable namespace</li>
</ul>
</div>
</div>
