# Scenario 10: Write Path — Initiator-Owned + Remote NVMe-oF L2 (alt architecture)
#
# THIS IS NOT A VARIANT OF SCENARIO 5.
#
# Scenario 5 measures the storage-owned pull model: LMCache runs on both the
# compute node AND the storage node; the storage-side agent owns semantic
# admission, MR leases, and BLAKE3-on-commit verification.
#
# Scenario 10 measures a fundamentally different architecture: LMCache runs
# ONLY on the compute (initiator) side. The storage node exports NVMe SSDs
# over NVMe-oF/RDMA via nvmet-rdma. There is NO target-side LMCache agent.
# Cache-level admission, per-key semantics, BLAKE3 verification, and
# key -> LBA mapping all live on the initiator.
#
# See docs/design/v1/platform/ipu-poc/nvmeof-initiator-only-alternative.md
# for the architectural analysis.
#
# What this scenario measures:
#
#   1. NVMe-oF/RDMA transport cost for a KV-page-sized write, end-to-end
#      from the initiator LMCache into a durable target LBA range.
#   2. The initiator's atomic-commit cost: WAL intent write, payload
#      write with FUA, checksum write with FUA, map publication. This is
#      NOT free and must not be conflated with an M1 verbs number.
#   3. Attach-time and reconnect behavior for the NVMe-oF connection --
#      those are new failure surfaces the storage-owned track does not have.
#
# Non-goal: the storage-owned pull-model semantics measured by scenarios 1-9.
# Those cannot be recovered without adding an agent back on the storage side.

scenario: write_nvmeof_initiator
description: >
  Initiator-owned LMCache writes a KV page through a remote NVMe-oF/RDMA
  namespace with durable-commit ordering. Alt architecture; not comparable
  to scenario 5 numbers.

architecture: initiator_owned_nvmeof_l2
storage_topology:
  compute_node:
    runs_lmcache: true
    tiers:
      - L1: initiator DRAM/HBM (LMCache-managed)
      - L2: remote NVMe namespace via nvme connect -t rdma (LMCache-managed)
  storage_node:
    runs_lmcache: false          # explicit — no target-side agent
    exports: nvmet-rdma
    role: passive block target

# =============================================================================
# PREREQUISITES (all captured in the alt-track script layer, not runnable yet)
# =============================================================================
prerequisites:
  target_side:
    - nvmet-rdma provisioning: NQN, listener, namespace, host ACLs
    - queue-depth and inline-data-size configured for KV page size
  initiator_side:
    - nvme connect -t rdma with tuned ctrl-loss-tmo and reconnect_delay
    - stable device path resolved via /dev/disk/by-id/nvme-<eui>
    - LMCache configured with raw_block L2 pointing at the attached device
    - WAL durable-commit protocol enabled on top of raw_block (COW deferred to post-POC)
  fabric:
    - 192.168.200 RoCEv2, MTU >= 4096 verified end-to-end

# =============================================================================
# COMMAND (placeholder — nvmeof_bench_runner.py is not yet implemented.
# The provision/attach/disconnect calls below use the current interfaces
# of scripts/nvmeof_target_provision.sh and scripts/nvmeof_initiator_attach.sh
# so that when the runner lands, the glue is already correct.)
# =============================================================================
tool: nvmeof_bench_runner   # scripts/nvmeof_bench_runner.py — greenfield
command: |
  # Target side (bmg1): create the subsystem, backed by the pre-nominated
  # namespace device, listening on the 192.168.200 fabric with an explicit
  # host-NQN ACL. No --allow-any-host, no --allow-non-fabric-ip.
  ssh ${target_host} "cd ${remote_repo} && \
    ./scripts/nvmeof_target_provision.sh setup \
      --nqn ${target_nqn} \
      --namespace-device ${namespace_device} \
      --listen-ip ${target_ip} \
      --host-nqn ${host_nqn}"

  # Initiator side: attach, capture the stable /dev/disk/by-id path.
  BY_ID=$(./scripts/nvmeof_initiator_attach.sh connect \
    --target-ip ${target_ip} \
    --nqn ${target_nqn} \
    --host-nqn ${host_nqn} | tail -1)

  # Benchmark. --device gets the stable by-id path from `connect`.
  python scripts/nvmeof_bench_runner.py \
    --device "${BY_ID}" \
    --page-size ${page_size} \
    --iterations ${iters} \
    --queue-depth ${queue_depth} \
    --commit-protocol ${commit_protocol} \
    --verify-recovery

  # Teardown -- always disconnect the initiator; target teardown is caller-driven.
  ./scripts/nvmeof_initiator_attach.sh disconnect --nqn ${target_nqn}
  ssh ${target_host} "cd ${remote_repo} && \
    ./scripts/nvmeof_target_provision.sh teardown \
      --nqn ${target_nqn} --listen-ip ${target_ip}"

# =============================================================================
# WIRE MODEL (per page, best case, single initiator)
#
# Direction is measured from the INITIATOR's point of view:
#   tx = bytes leaving the initiator NIC
#   rx = bytes arriving at the initiator NIC
#
# For every NVMe Write in this flow (WAL intent, payload, checksum record,
# WAL commit record), the *initiator* posts the command capsule, and the
# *target* posts an RDMA Read against the initiator's registered buffer to
# pull the write payload -- so the payload data phase is INITIATOR-TX for
# every write, not INITIATOR-RX.
#
# All four writes therefore share the same wire shape:
#   cmd (tx small) -> rdma_read (tx payload) -> cqe (rx small)
#   [+ optional flush cmd (tx) -> flush cqe (rx) when a durability
#    barrier is required (WAL intent, WAL commit)].
#
# Model matches diagrams/architecture-a-nvmeof-wal-sequence.mmd.
# =============================================================================
wire_model:
  per_page:
    # Step 1 -- WAL intent write + flush (durable barrier)
    - {phase: "intent_nvme_cmd",      dir: "tx", bytes: 72,  note: "NVMe Write command capsule (WAL intent)"}
    - {phase: "intent_rdma_read",     dir: "tx", bytes: 128, note: "target RDMA Read pulls intent record {key, LBA, D}"}
    - {phase: "intent_cqe",           dir: "rx", bytes: 16,  note: "NVMe completion (intent durable on media)"}
    - {phase: "intent_flush_cmd",     dir: "tx", bytes: 72,  note: "NVMe FLUSH command capsule"}
    - {phase: "intent_flush_cqe",     dir: "rx", bytes: 16,  note: "NVMe FLUSH completion"}

    # Step 2 -- payload write with FUA
    - {phase: "payload_nvme_cmd",     dir: "tx", bytes: 72,  note: "NVMe Write command capsule (FUA)"}
    - {phase: "payload_rdma_read",    dir: "tx", bytes: "${model.page_size_bytes}", note: "target RDMA Read pulls payload"}
    - {phase: "payload_cqe",          dir: "rx", bytes: 16,  note: "NVMe completion (payload durable on media, FUA)"}

    # Step 3 -- checksum record write with FUA
    - {phase: "checksum_nvme_cmd",    dir: "tx", bytes: 72,  note: "NVMe Write command capsule (checksum record, FUA)"}
    - {phase: "checksum_rdma_read",   dir: "tx", bytes: 64,  note: "target RDMA Read pulls BLAKE3 record"}
    - {phase: "checksum_cqe",         dir: "rx", bytes: 16,  note: "NVMe completion (checksum durable on media, FUA)"}

    # Step 4a -- WAL commit record write + flush (durable-commit barrier before publish)
    - {phase: "commit_nvme_cmd",      dir: "tx", bytes: 72,  note: "NVMe Write command capsule (WAL commit record)"}
    - {phase: "commit_rdma_read",     dir: "tx", bytes: 32,  note: "target RDMA Read pulls commit record"}
    - {phase: "commit_cqe",           dir: "rx", bytes: 16,  note: "NVMe completion (commit record on media)"}
    - {phase: "commit_flush_cmd",     dir: "tx", bytes: 72,  note: "NVMe FLUSH command capsule (durable-commit barrier)"}
    - {phase: "commit_flush_cqe",     dir: "rx", bytes: 16,  note: "NVMe FLUSH completion (c5 begins here; steps 4b/4c are in-memory only)"}
  overhead_vs_scenario_5: >
    Do not compute this delta. Scenario 5 (write_rdma) measures cache-level
    admission over raw RDMA verbs with a target-side LMCache agent
    (Architecture B). Scenario 10 measures a full initiator-owned WAL
    durable-commit transaction against a passive nvmet-rdma target
    (Architecture A). The two measure different things.

# =============================================================================
# PARAMETERS
# =============================================================================
parameters:
  page_size: "${model.page_size_bytes}"
  iters: 100
  warmup: 10
  queue_depth: 16              # NVMe SQ depth on the initiator side
  commit_protocol: wal         # WAL only; COW deferred (see nvmeof-poc-plan.md Future Work)
  target_host: bmg1            # SSH alias for the nvmet-rdma target
  remote_repo: "~/tsg/LMCache" # LMCache checkout on the target host
  target_nqn: "nqn.2026-07.io.lmcache.alt:bmg1"
  target_ip: "192.168.200.4"   # 192.168.200 fabric IP; NEVER 192.168.100.x
  host_nqn: "nqn.2026-07.io.lmcache.alt:bmg0"  # initiator NQN; used as ACL
  namespace_device: "<opt-in via env / operator; refuses mounted / partitioned devices>"

# =============================================================================
# METRICS
# =============================================================================
metrics:
  primary:
    - end_to_end_write_latency_us    # store() call -> cache-visible
    - wal_intent_flush_us            # step 1 cost
    - payload_write_us               # step 2 cost (FUA)
    - checksum_write_us              # step 3 cost (FUA)
    - map_publish_us                 # step 4 cost
    - attach_time_ms                 # nvme connect -> device visible
    - reconnect_time_ms              # after simulated fabric loss
  derived:
    - commit_overhead_us: "end_to_end - payload_write_us"
    - fua_penalty_us: "payload_write_us - non_fua_baseline"
  correctness:
    - recovery_passes_after_crash_at_each_step   # crash-cutpoint tests
    - post_reconnect_map_consistent              # attach -> replay -> serve

# =============================================================================
# PASS CRITERIA (draft — refine after first end-to-end run)
# =============================================================================
pass_criteria:
  end_to_end_write_latency_us: ">= 0"      # placeholder; set after baseline
  attach_time_ms: "<= 500"
  reconnect_time_ms: "<= 5000"
  recovery_passes_after_crash_at_each_step: "all"
  post_reconnect_map_consistent: "true"
